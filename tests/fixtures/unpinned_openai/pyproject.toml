[project]
name = "thriller"
version = "1.0.0"
description = "Suspense ratings from a chat model"
requires-python = ">=3.8"
dependencies = [
    "together",
    "pytest",
    "openai",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
