[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apifix"
version = "0.1.0"
description = "Automatically fix Python code broken by API/library breaking changes, verified in a sandbox."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
apifix = "apifix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apifix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "docker: needs a Docker daemon and network; opt-in with --docker (skipped if unusable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Runs inside sandbox containers under Python 3.8+: no 3.11-only rewrites.
"src/apifix/engine/sandbox_driver.py" = ["UP"]
